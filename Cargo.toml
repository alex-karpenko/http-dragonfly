[package]
authors = ["Oleksii Karpenko <alexkarpenko@yahoo.com>"]
description = "HTTP requests splitter/router/relay"
edition = "2021"
keywords = ["http", "splitter", "relay", "router"]
license = "MIT OR Apache-2.0"
name = "http-dragonfly"
repository = "https://github.com/alex-karpenko/http-dragonfly"
version = "0.5.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
aws-config = "1.10.1"
aws-credential-types = "1.3.0"
aws-sigv4 = "1.5.1"
clap = { version = "4.6.4", features = ["derive"] }
futures-util = "0.3.33"
http-body-util = "0.1.4"
humantime-serde = "1.1.1"
hyper = { version = "1.11.0", features = ["http1"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = [
    "http1",
    "aws-lc-rs",
    "rustls-native-certs",
    "tls12",
    "webpki-roots",
] }
hyper-util = { version = "0.1.20", features = ["server", "client", "client-legacy", "http1", "server-auto"] }
jaq-core = "2.2.1"
jaq-json = { version = "1.1.3", features = ["serde_json"] }
jaq-std = "2.1.2"
regex = "1.13.1"
rustls = { version = "0.23.42", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
shellexpand = { version = "3.1.2", default-features = false, features = ["base-0"] }
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "signal", "tracing", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v4", "fast-rng"] }

[features]
# Enables aws-config's browser-based "login session" credential provider.
# Off by default: it's only needed to test aws_sigv4 signing locally against a
# profile that uses `login_session` (see README), and it pulls in an extra AWS
# SDK crate (aws-sdk-signin) that normal deployments don't need.
credentials-login = ["aws-config/credentials-login"]

[dev-dependencies]
insta = { version = "1.48.0", features = ["glob", "ron", "redactions", "filters"] }
reqwest = "0.13.4"
testcontainers-modules = { version = "0.15.0", features = ["localstack"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs", "tls12"] }

[build-dependencies]
anyhow = "1.0.104"
